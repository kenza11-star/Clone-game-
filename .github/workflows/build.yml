name: CI & Release Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

# only the newest run for a branch keeps going, older ones are cancelled
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build Vantra (arm64 GMS release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Gradle (mirrors + retry, for when services.gradle.org is down)
        run: |
          VER=$(grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-(.*)-bin\.zip.*/\1/')
          echo "Gradle $VER"
          fetch() {
            for i in 1 2 3; do
              if curl -fsSL --connect-timeout 20 --max-time 300 -o /tmp/gradle.zip "$1" && unzip -tq /tmp/gradle.zip > /dev/null; then
                return 0
              fi
              echo "failed: $1 (attempt $i)"
              sleep $((i * 10))
            done
            return 1
          }
          ok=0
          for url in \
            "https://services.gradle.org/distributions/gradle-$VER-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-$VER-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-$VER-bin.zip" \
            "https://mirrors.aliyun.com/gradle/gradle-$VER-bin.zip"; do
            if fetch "$url"; then ok=1; echo "got Gradle from $url"; break; fi
          done
          [ "$ok" = 1 ] || { echo "no Gradle mirror worked"; exit 1; }
          # CI only: point the wrapper at the downloaded zip so the build never hits the dead server
          sed -i 's#^distributionUrl=.*#distributionUrl=file\\:///tmp/gradle.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#^validateDistributionUrl=.*#validateDistributionUrl=false#' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Remove leftovers of the old mochy source
        run: bash .github/scripts/remove-old-source.sh

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore release keystore (permanent signing key)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
            echo "release keystore restored"
          elif [ "${{ github.repository }}" = "kenza11-star/vantra-" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing. Without it the APK is signed with a random key and can never update the installed app. Add the secrets, then re-run."
            exit 1
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, release falls back to a random debug key"
          fi

      - name: Build Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'vantra' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
        run: |
          # a download that hit a 5xx stays cached, so the next attempt only fetches what's missing
          for i in 1 2 3 4; do
            ./gradlew assembleArm64GmsRelease --no-configuration-cache --console=plain --warning-mode summary && exit 0
            echo "Build failed (attempt $i), retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vantra-arm64-release
          path: app/build/outputs/apk/arm64Gms/release/*.apk