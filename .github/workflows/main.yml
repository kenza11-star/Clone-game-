name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web (Vite)
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Patch Android (landscape + fullscreen)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          S=android/app/src/main/res/values/styles.xml
          grep -q 'screenOrientation' "$M" || sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' "$M"
          grep -q 'windowFullscreen' "$S" || sed -i 's|</style>|    <item name="android:windowFullscreen">true</item>\n    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n</style>|g' "$S"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BlockObby-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Block Obby build #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
